<!doctype html>
<html lang="en">
 <head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WikiChat — Vintage Wikipedia Explorer</title>
<style>
  :root{
    --green:#3ddc6a;
    --paper:#f3ecd2;
    --paper2:#ece2bd;
    --ink:#141414;
    --muted:#6b6354;
    --line:#141414;
    --hover:#e0d39a;
    --sel:#d4c277;
    --accent:#7a1f12;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:"Courier New",ui-monospace,Menlo,monospace;
    color:var(--ink);
    background:var(--green);
    background-image:
      radial-gradient(rgba(0,0,0,.06) 1px,transparent 1px),
      radial-gradient(rgba(0,0,0,.04) 1px,transparent 1px);
    background-size:3px 3px,7px 7px;
    background-position:0 0,1px 2px;
    padding:24px;
    display:flex;align-items:center;justify-content:center;
  }

  .window{
    width:min(1180px,100%); height:min(760px,calc(100vh - 48px));
    background:var(--paper);
    border:3px solid var(--ink);
    box-shadow:10px 10px 0 var(--ink);
    display:grid; grid-template-rows:42px 44px 1fr;
    position:relative;
  }
  
  .titlebar{
    display:flex;align-items:center;padding:0 14px;border-bottom:3px solid var(--ink);
    background:var(--paper); font-weight:bold; font-size:18px;
  }
  .dots{display:flex;gap:8px}
  .dot{width:14px;height:14px;border:2px solid var(--ink);border-radius:50%;background:var(--paper2)}
  .title-center{flex:1;text-align:center;letter-spacing:1px}

  .toolbar{
    display:grid;grid-template-columns:300px 1fr;border-bottom:3px solid var(--ink);
  }
  .toolbar .left{
    display:flex;align-items:center;gap:14px;padding:0 14px;border-right:3px solid var(--ink);
  }
  .toolbar .left .ico{font-size:18px;cursor:pointer}
  .toolbar .right{
    display:flex;align-items:center;padding:0 16px;font-weight:bold;gap:10px;
  }
  .toolbar .right .members{margin-left:auto;display:flex;align-items:center;gap:10px;font-weight:normal}

  .layout{display:grid;grid-template-columns:300px 1fr;height:100%;overflow:hidden;border-top:0}

  .sidebar{
    border-right:3px solid var(--ink); background:var(--paper);
    overflow:auto; padding:14px 10px 14px 14px;
  }
  .team{
    border:2.5px solid var(--ink); background:var(--paper2); padding:8px 10px;
    display:flex;justify-content:space-between;align-items:center;font-weight:bold;
    box-shadow:3px 3px 0 var(--ink); margin-bottom:18px; position:relative;
  }
  .team::after{
    content:""; position:absolute; right:-6px; top:6px; width:100%; height:100%;
    border:2.5px solid var(--ink); z-index:-1; background:var(--paper2);
  }
  .team .caret{
    width:22px;height:22px;border:2px solid var(--ink);background:var(--paper);
    display:flex;align-items:center;justify-content:center;
  }

  .grp{display:flex;align-items:center;gap:8px;font-weight:bold;margin:14px 0 6px;font-size:15px}
  .grp .tog{
    width:18px;height:18px;border:2px solid var(--ink);background:var(--paper);
    display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;
  }
  .grp .ic{
    width:22px;height:18px;border:2px solid var(--ink);background:var(--paper2);
    border-radius:3px 6px 0 0;
  }

  .tree{margin:4px 0 6px 9px;border-left:2px solid var(--ink);padding-left:0}
  .branch{
    display:flex;align-items:center;gap:6px;padding:3px 4px 3px 0;cursor:pointer;
    position:relative;font-size:14px;color:var(--muted);
  }
  .branch::before{
    content:""; display:inline-block; width:14px; height:0; border-top:2px solid var(--ink);
    margin-left:-2px;
  }
  .branch.active{color:var(--ink);font-weight:bold}
  .branch:hover{color:var(--ink)}
  .branch .q{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
  .empty{color:var(--muted);font-size:12px;padding:6px;font-style:italic}

  .main{display:grid;grid-template-rows:1fr 60px;height:100%;overflow:hidden}
  .feed{overflow:auto;padding:18px 22px;background:var(--paper)}
  .msg{display:grid;grid-template-columns:48px 1fr;gap:12px;margin-bottom:22px}
  .avatar{
    width:44px;height:44px;border:2.5px solid var(--ink);background:var(--paper2);
    display:flex;align-items:center;justify-content:center;font-weight:bold;
    filter:contrast(1.1) grayscale(.2);
  }
  .meta{display:flex;align-items:center;gap:10px;margin-bottom:4px;font-weight:bold}
  .meta .time{color:var(--muted);font-size:12px;font-weight:normal}
  .meta .size{margin-left:auto;color:var(--muted);font-size:12px;font-weight:normal}
  .bubble{
    border:2px solid var(--ink);background:#fbf5dd;padding:10px 12px;
    box-shadow:3px 3px 0 var(--ink);
  }
  .bubble h3{margin:0 0 6px;font-size:15px;border-bottom:1.5px dashed var(--ink);padding-bottom:4px}
  .bubble p{margin:6px 0;line-height:1.5}
  .bubble a{color:var(--accent);text-decoration:underline}
  .thumb{
    float:right;margin:0 0 8px 12px;max-width:240px;border:2.5px solid var(--ink);
    filter: grayscale(1) contrast(1.5) sepia(.35);
    box-shadow:3px 3px 0 var(--ink);
  }

  .results{display:grid;gap:8px;margin-top:8px}
  .result{
    border:1.5px solid var(--ink);padding:6px 8px;background:var(--paper2);cursor:pointer;
  }
  .result:hover{background:var(--hover)}
  .result .t{font-weight:bold}
  .result .s{font-size:12px;color:var(--muted)}

  .composer{
    border-top:3px solid var(--ink);background:var(--paper);
    display:flex;align-items:center;padding:10px 14px;gap:10px;
  }
  .composer input{
    flex:1;font-family:inherit;font-size:15px;background:transparent;
    border:none;outline:none;padding:8px 6px;color:var(--ink);
  }
  .composer input::placeholder{color:var(--muted);font-style:italic}
  .composer button{
    font-family:inherit;font-size:14px;background:var(--paper);
    border:2.5px solid var(--ink);padding:8px 22px;font-weight:bold;cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);
  }
  .composer button:hover{background:var(--hover)}
</style>
</head>

<body>
  <div class="window">

    <div class="titlebar">
      <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      <div class="title-center">WikiChat</div>
      <div style="width:46px"></div>
    </div>

    <div class="toolbar">
      <div class="left">
        <span class="ico" title="New">＋</span>
        <span class="ico" title="New channel">⊞⁺</span>
        <span class="ico" title="Add member">☺⁺</span>
        <span class="ico" title="Messages">✉</span>
      </div>
      <div class="right">
        <span># </span><span id="curChan">en-wikipedia</span>
        <span class="members">Members: [1]</span>
      </div>
    </div>

    <div class="layout">
      <aside class="sidebar">
        <div class="team">
          <span>MyTeam</span>
          <span class="caret">▼</span>
        </div>

        <div class="grp">
          <span class="ic"></span>
          <span>Channels</span>
        </div>

        <div class="tree" id="channels">
          <div class="branch active" data-fixed="en-wikipedia"># en-wikipedia</div>
        </div>

        <div class="grp">
          <span class="ic"></span>
          <span>Search History</span>
        </div>
        <div class="tree" id="history">
          <div class="empty">No searches yet.</div>
        </div>

        <div class="grp">
          <span class="tog">＋</span>
          <span class="ic" style="border-radius:50%;width:18px;height:18px"></span>
          <span>Direct Messages</span>
        </div>
        <div class="tree" id="notif">
          <div class="empty">Loading topics…</div>
        </div>
      </aside>

      <section class="main">
        <div class="feed" id="feed"></div>
        <form class="composer" id="form" autocomplete="off">
          <input id="q" placeholder="Your message"
                 autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                 name="wc_q_no_autofill" />
          <button type="submit">Send</button>
        </form>
      </section>
    </div>
  </div>

<script>
const API="https://en.wikipedia.org/w/api.php";
const HOST="https://en.wikipedia.org";
const $=s=>document.querySelector(s);
const historyEl=$("#history"), notifEl=$("#notif"), feedEl=$("#feed"), qEl=$("#q");
let history=[];

function pageUrl(t){return HOST+"/wiki/"+encodeURIComponent(t.replace(/ /g,"_"))}
function nowTime(){return new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

async function apiCall(p){
  const url=API+"?"+new URLSearchParams({...p,format:"json",origin:"*"}).toString();
  const r=await fetch(url); if(!r.ok) throw new Error("HTTP "+r.status); return r.json();
}

function addMsg(name, html, size){
  const el=document.createElement("div"); el.className="msg";
  el.innerHTML=`
    <div class="avatar">${name[0].toUpperCase()}</div>
    <div>
      <div class="meta">
        <span>${name} ●</span><span class="time">${nowTime()}</span>
        ${size?`<span class="size">${size}</span>`:""}
      </div>
      <div class="bubble">${html}</div>
    </div>`;
  feedEl.appendChild(el); feedEl.scrollTop=feedEl.scrollHeight; return el;
}

function pushHistory(q){history.unshift({q,t:Date.now()}); history=history.slice(0,30); renderHistory();}
function renderHistory(){
  if(!history.length){historyEl.innerHTML='<div class="empty">No searches yet.</div>';return;}
  historyEl.innerHTML="";
  history.forEach(h=>{
    const d=document.createElement("div"); d.className="branch";
    d.innerHTML=`<span class="q"># ${esc(h.q)}</span>`;
    d.onclick=()=>{qEl.value=h.q; runSearch(h.q);};
    historyEl.appendChild(d);
  });
}

async function runSearch(query){
  addMsg("you", `<p><b>${esc(query)}</b></p>`);
  pushHistory(query);
  const loading=addMsg("wikipedia", `<p>Dialing the archives…</p>`);

  try{
    const s=await apiCall({action:"query",list:"search",srsearch:query,srlimit:"6"});
    const hits=(s.query&&s.query.search)||[];
    if(!hits.length){loading.querySelector(".bubble").innerHTML="<p>No matches found.</p>";return;}
    const top=hits[0];
    const ext=await apiCall({
      action:"query",prop:"extracts|pageimages",exintro:"1",explaintext:"1",
      piprop:"thumbnail",pithumbsize:"500",titles:top.title,redirects:"1"
    });
    const page=Object.values((ext.query&&ext.query.pages)||{})[0]||{};
    const img=page.thumbnail&&page.thumbnail.source;
    const extract=page.extract||top.snippet.replace(/<[^>]+>/g,"");

    let html=`<h3><a href="${pageUrl(top.title)}" target="_blank" rel="noopener">${esc(top.title)}</a></h3>`;
    if(img) html+=`<img class="thumb" src="${img}" alt="">`;
    html+=`<p>${esc(extract).slice(0,900)}${extract.length>900?"…":""}</p>`;
    html+=`<div class="results"><div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px">More results</div>`;
    hits.slice(1).forEach(h=>{
      html+=`<div class="result" onclick="window.open('${pageUrl(h.title)}','_blank')">
        <div class="t">${esc(h.title)}</div>
        <div class="s">${h.snippet.replace(/<[^>]+>/g,"")}</div></div>`;
    });
    html+=`</div>`;
    const sizeKb=(extract.length/1024).toFixed(2).replace(".",",")+" kb";
    loading.querySelector(".bubble").innerHTML=html;
    loading.querySelector(".meta .size") || (()=> {
      const sp=document.createElement("span"); sp.className="size"; sp.textContent=sizeKb;
      loading.querySelector(".meta").appendChild(sp);
    })();
  }catch(e){
    loading.querySelector(".bubble").innerHTML=`<p style="color:var(--accent)">Error: ${esc(e.message)}</p>`;
  }
}

$("#form").addEventListener("submit",e=>{
  e.preventDefault();
  const q=qEl.value.trim(); if(!q) return;
  runSearch(q); qEl.value="";
});

function dayKey(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}

/* FIXED: programming-only single topic (no API, no randomness) */
function loadNotif(){
  const topics = [
    "JavaScript",
    "Python Programming",
    "C++ Basics",
    "React.js Fundamentals",
    "Node.js Runtime",
    "Data Structures and Algorithms",
    "Operating Systems Concepts",
    "Database Management Systems",
    "Web Development",
    "Artificial Intelligence"
  ];

  const seed = parseInt(dayKey().replace(/-/g,""),10);
  const index = seed % topics.length;
  const topic = topics[index];

  notifEl.innerHTML = "";

  const d = document.createElement("div");
  d.className = "branch";
  d.innerHTML = `<span class="q"># ${esc(topic)}</span>`;
  d.onclick = () => {
    qEl.value = topic;
    runSearch(topic);
  };

  notifEl.appendChild(d);
}

loadNotif();

addMsg("wikichat", `<h3>Welcome to WikiChat</h3>
  <p>Type any topic below to search <b>English Wikipedia</b>. Your searches show up as branches
  under <i>Search History</i>. Daily topics rotate under <i>Direct Messages</i> — click any one to
  open it right here, never leaving the app.</p>`);
</script>
</body>
</html>
